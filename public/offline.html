<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MounTrack | Sem conexao</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080e1a;
        --panel: rgba(15, 23, 41, 0.92);
        --panel-border: rgba(255, 255, 255, 0.08);
        --accent: #34d399;
        --text: #f1f5f9;
        --muted: #8fa3c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(52, 211, 153, 0.1), transparent 30%),
          radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.08), transparent 35%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .panel {
        width: min(100%, 420px);
        padding: 28px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      .badge {
        display: inline-flex;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.05;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
      }
      .primary {
        background: linear-gradient(135deg, var(--accent), #059669);
        color: white;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <span class="badge">MounTrack offline</span>
      <h1>Sem conexao agora.</h1>
      <p>
        O app continua instalado, mas esta parte precisa de internet para
        sincronizar peso, doses, assinatura e nutricao.
      </p>
      <div class="actions">
        <a class="primary" href="/">Tentar novamente</a>
        <a class="secondary" href="/login">Ir para login</a>
      </div>
    </main>
  </body>
</html>
